<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可用 MCP 服务器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #ffffff; color: #0f1115; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; padding: 24px; }
  h1 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .sub { color: #81858c; font-size: 12px; margin-top: 6px; }
  .actions { margin: 16px 0; display: flex; gap: 10px; }
  button { border: 1px solid #0f1115; background: #fff; color: #0f1115; padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  button:hover { background: #0f1115; color: #fff; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid #ececf0; vertical-align: top; }
  th { color: #81858c; font-weight: 500; font-size: 12px; }
  .mono { font-family: Consolas, "Courier New", monospace; font-size: 12px; }
  .ok { color: #0f1115; background: #eef1f4; border-radius: 6px; padding: 2px 8px; }
  .warn { color: #b45309; background: #fdf3e7; border-radius: 6px; padding: 2px 8px; }
  .bad { color: #dc2626; background: #fdecec; border-radius: 6px; padding: 2px 8px; }
  .empty { color: #81858c; text-align: center; padding: 40px 0; }
</style>
</head>
<body>
  <h1>可用 MCP 服务器</h1>
  <div class="sub">扫描 Harness 配置（~/.dsh/profiles）与常见客户端（Claude Desktop / Cursor / VS Code / Cline / Windsurf）</div>
  <div class="actions">
    <button id="refresh">重新检测</button>
    <button id="close">关闭</button>
  </div>
  <div id="content"></div>
  <script>
    const content = document.getElementById('content');
    async function run() {
      content.innerHTML = '<div class="empty">正在检测…</div>';
      const list = await window.dshDesktop.detectMcp();
      if (!list.length) { content.innerHTML = '<div class="empty">未发现已配置的 MCP 服务器</div>'; return; }
      let html = '<table><tr><th>名称</th><th>来源</th><th>类型</th><th>命令 / 地址</th><th>状态</th></tr>';
      for (const s of list) {
        const badge = s.status === '可用' || s.status === '可连接' ? 'ok' : (s.status === '无法连接' || s.status === '命令未找到' ? 'bad' : 'warn');
        const target = s.transport === 'stdio' ? `<span class="mono">${escapeHtml(s.command)} ${escapeHtml((s.args || []).join(' '))}</span>` : `<span class="mono">${escapeHtml(s.url)}</span>`;
        html += `<tr><td>${escapeHtml(s.name)}</td><td>${escapeHtml(s.source)}</td><td>${escapeHtml(s.transport)}</td><td>${target}</td><td><span class="${badge}">${escapeHtml(s.status)}</span></td></tr>`;
      }
      content.innerHTML = html + '</table>';
    }
    function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    document.getElementById('refresh').addEventListener('click', run);
    document.getElementById('close').addEventListener('click', () => window.close());
    run();
  </script>
</body>
</html>
